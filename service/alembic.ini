# Alembic configuration.
#
# `Base.metadata.create_all` can only CREATE, never ALTER. That is why adding
# `avg_utilization` to RoutingEvent would silently fail to reach any existing
# deployment, leaving `congestion_events` permanently zero there even after the
# code was fixed.

[alembic]
script_location = migrations
prepend_sys_path = ..
version_path_separator = os
# sqlalchemy.url is read from the DATABASE_URL environment variable in env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
