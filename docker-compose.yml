services: #all the images to be used and their details
  db: #postgres
    image: postgres:16
    container_name: routing-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routinguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routingpass}
      POSTGRES_DB: ${POSTGRES_DB:-routing_db}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routinguser} -d ${POSTGRES_DB:-routing_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin: #pgadmin
    image: dpage/pgadmin4:8
    container_name: routing-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
#to be run in detach mode only..default networkcreated 