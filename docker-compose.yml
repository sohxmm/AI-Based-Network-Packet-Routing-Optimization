# `git clone && make up` has to work on a machine that has never seen this
# project. It previously did not: three services declared `env_file: .env`,
# .env is gitignored, and nothing created it, so the very first command a
# reviewer runs failed with "env file .env not found".

services:
  db:
    image: postgres:16
    container_name: routing-db
    restart: unless-stopped
    env_file:
      # required:false means a fresh clone starts without any manual step.
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routinguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routingpass}
      POSTGRES_DB: ${POSTGRES_DB:-routing_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routinguser} -d ${POSTGRES_DB:-routing_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      # Root context: the service imports core/, routing/, ml/ and experiments/.
      context: .
      dockerfile: service/Dockerfile
    container_name: routing-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-routinguser}:${POSTGRES_PASSWORD:-routingpass}@db:5432/${POSTGRES_DB:-routing_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Live ICMP probing stays off unless explicitly enabled.
      LIVE_PROBE_ENABLED: ${LIVE_PROBE_ENABLED:-0}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # An unbounded ACO benchmark can otherwise consume the whole host.
          cpus: "2.0"
          memory: 4G

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: routing-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  # A development tool with a default password does not belong in the path a
  # reviewer runs by accident. Start it explicitly:
  #   docker compose --profile dev up
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: routing-pgadmin
    restart: unless-stopped
    profiles: ["dev"]
    env_file:
      - path: .env
        required: false
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-changeme}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
